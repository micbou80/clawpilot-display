<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Pro v3 — Emoji Design</title>
<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
    const theme = param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
:root {
  color-scheme: light;
  --cp-bg: #f7f4ef;
  --cp-bg-elevated: #fcfbf8;
  --cp-surface: #ffffff;
  --cp-surface-soft: #f5f5f5;
  --cp-border: #dedede;
  --cp-border-strong: #919191;
  --cp-text: #242424;
  --cp-text-muted: #5c5c5c;
  --cp-text-soft: #6f6f6f;
  --cp-accent: #b11f4b;
  --cp-accent-hover: #9a1a41;
  --cp-accent-soft: rgba(177, 31, 75, 0.08);
  --cp-accent-fg: #ffffff;
  --cp-success: #16a34a;
  --cp-danger: #dc2626;
  --cp-warning: #f59e0b;
  --cp-link: #0078d4;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
  --cp-overlay: rgba(255, 255, 255, 0.8);
  --cp-panel: rgba(255, 255, 255, 0.86);
  --cp-panel-strong: rgba(255, 255, 255, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.55);
  --cp-highlight: rgba(177, 31, 75, 0.12);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --cp-bg: #3d3b3a;
  --cp-bg-elevated: #343231;
  --cp-surface: #292929;
  --cp-surface-soft: #2e2e2e;
  --cp-border: #474747;
  --cp-border-strong: #5f5f5f;
  --cp-text: #dedede;
  --cp-text-muted: #919191;
  --cp-text-soft: #b0b0b0;
  --cp-accent: #fd8ea1;
  --cp-accent-hover: #fb7b91;
  --cp-accent-soft: rgba(253, 142, 161, 0.14);
  --cp-accent-fg: #1a1a1a;
  --cp-success: #4ade80;
  --cp-danger: #f87171;
  --cp-warning: #fbbf24;
  --cp-link: #4da6ff;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
  --cp-overlay: rgba(41, 41, 41, 0.88);
  --cp-panel: rgba(41, 41, 41, 0.72);
  --cp-panel-strong: rgba(41, 41, 41, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.04);
  --cp-highlight: rgba(253, 142, 161, 0.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--cp-bg);
  color: var(--cp-text);
  min-height: 100vh;
  padding: 24px;
}

.header { text-align: center; margin-bottom: 20px; }
.header h1 { font-size: 22px; font-weight: 600; }
.header p { color: var(--cp-text-muted); font-size: 13px; margin-top: 4px; }

/* Category tabs */
.categories { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 20px; }
.cat-btn {
  padding: 6px 14px; border-radius: 0.625rem; border: 1px solid var(--cp-border);
  background: var(--cp-surface); color: var(--cp-text-muted); font-size: 13px; cursor: pointer; transition: all 0.15s;
}
.cat-btn:hover { border-color: var(--cp-accent); color: var(--cp-accent); }
.cat-btn.active { background: var(--cp-accent); color: var(--cp-accent-fg); border-color: var(--cp-accent); }

.layout { display: flex; gap: 24px; max-width: 1200px; margin: 0 auto; align-items: flex-start; }
.scenario-list {
  width: 260px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px;
  max-height: 80vh; overflow-y: auto; padding-right: 6px;
}
.scenario-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px;
  border-radius: 8px; cursor: pointer; transition: all 0.15s; border: 1px solid transparent; font-size: 13px;
}
.scenario-item:hover { background: var(--cp-accent-soft); }
.scenario-item.active { background: var(--cp-accent-soft); border-color: var(--cp-accent); }
.scenario-item .icon { font-size: 16px; width: 24px; text-align: center; flex-shrink: 0; }
.scenario-item .label { font-weight: 500; }
.scenario-item .badge {
  font-size: 9px; padding: 1px 6px; border-radius: 4px;
  background: var(--cp-accent-soft); color: var(--cp-accent); margin-left: auto; flex-shrink: 0;
}

.preview-area { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 16px; }

/* ── DEVICE FRAME ── */
.device-frame {
  background: linear-gradient(145deg, #8a8785, #6e6c6a);
  border-radius: 14px;
  padding: 10px 10px 28px 10px;
  box-shadow: var(--cp-shadow), 0 2px 0 #555 inset, 0 -1px 0 #444;
  position: relative;
}
.device-btns {
  position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px;
}
.device-btn-round {
  width: 10px; height: 10px; border-radius: 50%;
  background: linear-gradient(145deg, #999, #777);
  box-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.1) inset;
}
.device-usb {
  position: absolute; right: -4px; top: 50%; transform: translateY(-50%);
  width: 6px; height: 14px; background: #555; border-radius: 0 2px 2px 0;
}
.device-feet {
  position: absolute; bottom: -4px; left: 16px; right: 16px;
  display: flex; justify-content: space-between;
}
.device-foot { width: 12px; height: 4px; border-radius: 0 0 3px 3px; background: #444; }

/* ── THE SCREEN (480x320) ── */
.screen {
  width: 480px; height: 320px;
  background: #0a0a0f;
  border-radius: 6px;
  overflow: hidden;
  position: relative;
}

/* ── STATUS BAR ── */
.sbar {
  height: 28px; display: flex; align-items: center; padding: 0 16px;
  font-size: 12px; color: #8a8a8a;
}
.sbar-left { font-weight: 500; color: #c0c0c0; }
.sbar-center { flex: 1; text-align: center; display: flex; align-items: center; justify-content: center; gap: 5px; }
.sbar-right { display: flex; align-items: center; gap: 5px; }
.sbar-batt { display: inline-flex; align-items: center; gap: 3px; }
.sbar-batt-icon {
  width: 18px; height: 10px; border: 1px solid #777; border-radius: 2px; position: relative;
  display: inline-block;
}
.sbar-batt-icon::after {
  content: ''; position: absolute; right: -3px; top: 2px; width: 2px; height: 4px;
  background: #777; border-radius: 0 1px 1px 0;
}
.sbar-batt-fill { position: absolute; left: 1px; top: 1px; bottom: 1px; border-radius: 1px; }

/* ── CONTENT AREA ── */
.content-area { padding: 0 16px; height: 292px; overflow: hidden; position: relative; }

/* ── CONSISTENT TWO-COLUMN LAYOUT ── */
.two-col {
  display: flex; gap: 14px; height: 100%;
}
.col-left {
  width: 160px; flex-shrink: 0;
  display: flex; flex-direction: column; padding-top: 6px;
}
.col-right {
  flex: 1; display: flex; flex-direction: column; padding-top: 6px;
  overflow: hidden;
}
.col-left-quick {
  flex: 1;
}
.col-left-orb {
  display: flex; justify-content: center; padding-bottom: 12px;
}

/* ── ACCENT COLORS ── */
:root {
  --rd-accent: #e87c3e;
  --rd-accent-soft: rgba(232, 124, 62, 0.12);
  --rd-blue: #5b9bd5;
  --rd-purple: #7b68ee;
  --rd-green: #4ade80;
  --rd-red: #f87171;
  --rd-gold: #fbbf24;
  --rd-cyan: #67e8f9;
}

/* ── SECTION HEADER ── */
.section-hdr {
  display: flex; align-items: center; gap: 6px;
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px;
  color: var(--rd-accent); margin-bottom: 8px; white-space: nowrap;
}
.section-hdr .s-icon { font-size: 12px; }

/* ── CARD ── */
.card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px;
  padding: 10px 12px;
}

/* ── EMOJI INDICATOR (replaces orb) ── */
.emoji-indicator {
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.emoji-icon {
  font-size: 48px;
  filter: drop-shadow(0 0 12px rgba(232,124,62,0.25));
  animation: emoji-breathe 4s ease-in-out infinite;
}
@keyframes emoji-breathe {
  0%,100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(232,124,62,0.25)); }
  50% { transform: scale(1.08); filter: drop-shadow(0 0 18px rgba(232,124,62,0.4)); }
}
.emoji-icon.sm { font-size: 36px; }
.emoji-icon.urgent { animation: emoji-breathe 1.2s ease-in-out infinite; }
.emoji-icon.alert { animation: emoji-breathe 2s ease-in-out infinite; }
.emoji-icon.calm { animation: emoji-breathe 5s ease-in-out infinite; }
.emoji-icon.sleep { animation: emoji-breathe 6s ease-in-out infinite; opacity: 0.4; }
.emoji-icon.work { animation: emoji-breathe 2.5s ease-in-out infinite; }
.emoji-icon.none { animation: none; }

/* ── TEXT STYLES ── */
.scr-body { color: #c8c8c8; font-size: 13px; line-height: 1.5; }
.scr-muted { color: #666; font-size: 11px; }
.scr-dim { color: #444; font-size: 10px; }
.scr-white { color: #e0e0e0; }
.scr-bold { font-weight: 600; }

/* ── BIG METRIC (left column) ── */
.big-metric {
  font-size: 32px; font-weight: 200; letter-spacing: 1px;
  font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace;
  line-height: 1.1;
}
.metric-label { font-size: 11px; color: #666; margin-top: 2px; }

/* ── CLOCK ── */
.big-clock { font-size: 72px; font-weight: 200; color: #e0e0e0; text-align: center; letter-spacing: 3px;
  font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace; }
.big-clock .colon { opacity: 0.3; animation: blink-c 1s steps(1) infinite; }
@keyframes blink-c { 0%,49%{opacity:0.3} 50%,100%{opacity:0.8} }

/* ── TODAY CALENDAR STRIP (bottom of right col) ── */
.today-strip { margin-top: auto; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.04); }
.today-hdr { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #555; margin-bottom: 4px; }
.today-item {
  display: flex; align-items: center; gap: 6px; font-size: 11px; color: #888; padding: 2px 0;
}
.today-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--rd-blue); flex-shrink: 0; }
.today-time { color: #666; width: 36px; flex-shrink: 0; }
.today-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.today-until { color: #555; font-size: 10px; flex-shrink: 0; }

/* ── BADGES ── */
.badge-sm {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; color: #888; background: rgba(255,255,255,0.06);
  padding: 2px 8px; border-radius: 4px;
}

/* ── DASHBOARD GRID ── */
.dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dash-cell {
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.04);
  border-radius: 8px; padding: 10px;
}
.dash-label { font-size: 9px; color: #555; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.dash-val { font-size: 11px; color: #aaa; padding: 2px 0; }
.dash-val-hi { color: #ddd; }
.dash-dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; margin-right: 6px; }

/* ── FLIGHT ── */
.fl-code { font-size: 22px; color: #ddd; font-weight: 300; font-family: 'JetBrains Mono', Consolas, monospace; }
.fl-city { font-size: 9px; color: #555; }
.fl-status-badge { font-size: 10px; padding: 2px 8px; border-radius: 4px; }

/* ── HOME GRID ── */
.home-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }
.home-dev {
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.04);
  border-radius: 6px; padding: 6px; text-align: center;
}
.home-dev.on { border-color: rgba(74,222,128,0.2); }
.home-dev .d-icon { font-size: 14px; }
.home-dev .d-name { font-size: 8px; color: #777; margin-top: 1px; }
.home-dev .d-state { font-size: 8px; color: #555; }
.home-dev.on .d-state { color: #4ade80; }

/* ── VOICE WAVES ── */
.voice-bars { display: flex; align-items: center; gap: 2px; }
.vbar { width: 3px; border-radius: 2px; animation: vwave 0.7s ease-in-out infinite; }
@keyframes vwave { 0%,100%{height:6px} 50%{height:28px} }

/* ── SPARKLES ── */
.sparkle { position: absolute; font-size: 12px; animation: sparkle-anim 1.5s ease-in-out infinite; }
@keyframes sparkle-anim { 0%,100%{opacity:0;transform:scale(0.5)} 50%{opacity:1;transform:scale(1)} }

/* ── CODE RAIN (working) ── */
.rain-col {
  position: absolute; font-size: 10px; line-height: 13px; color: #0a3a0a; white-space: pre;
  animation: rain-fall linear infinite; font-family: 'JetBrains Mono', Consolas, monospace;
}
.rain-col .lead { color: #22c55e; text-shadow: 0 0 4px #22c55e; }
@keyframes rain-fall { from { transform: translateY(-80px); } to { transform: translateY(300px); } }

/* ── NIGHT ── */
.night-time {
  font-size: 40px; color: rgba(255,255,255,0.10); text-align: center;
  font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 200;
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -60%);
}

/* ── DESCRIPTION PANEL ── */
.desc-panel {
  background: var(--cp-surface); border: 1px solid var(--cp-border);
  border-radius: 0.625rem; padding: 16px 20px; max-width: 520px; width: 100%;
}
.desc-panel h2 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.desc-panel .cat-tag {
  display: inline-block; font-size: 10px; padding: 1px 8px; border-radius: 4px; margin-bottom: 8px;
}
.desc-panel p { font-size: 13px; color: var(--cp-text-muted); line-height: 1.5; }
.desc-panel .dets { margin-top: 10px; }
.desc-panel .det-row { display: flex; gap: 8px; font-size: 12px; padding: 3px 0; }
.desc-panel .det-lbl { color: var(--cp-text-soft); min-width: 80px; }
.desc-panel .det-val { color: var(--cp-text); }

/* ── FOCUS SPIN ── */
@keyframes focus-spin { to { transform: rotate(360deg); } }
@keyframes urg-pulse { 0%,100%{border-color:rgba(239,68,68,0.15)} 50%{border-color:rgba(239,68,68,0.4)} }
@keyframes personality-morph { 0%,100%{border-radius:50%;transform:scale(1)} 25%{border-radius:45% 55% 50% 50%;transform:scale(1.06)} 50%{border-radius:50% 45% 55% 50%;transform:scale(0.96)} 75%{border-radius:55% 50% 45% 55%;transform:scale(1.04)} }

/* ── RENDER GALLERY ── */
.render-gallery {
  width: 100%; max-width: 560px; margin-top: 8px;
}
.render-gallery h3 {
  font-size: 14px; font-weight: 600; color: var(--cp-text-muted); margin-bottom: 10px;
}
.render-grid { display: flex; flex-direction: column; gap: 12px; }
.render-card {
  border-radius: 10px; overflow: hidden;
  border: 1px solid var(--cp-border);
  background: var(--cp-surface);
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.render-card img {
  width: 100%; display: block;
}
.render-caption {
  padding: 8px 12px; font-size: 12px; color: var(--cp-text-muted); line-height: 1.4;
}

@media (max-width: 900px) {
  .layout { flex-direction: column; align-items: center; }
  .scenario-list { width: 100%; max-height: none; flex-direction: row; flex-wrap: wrap; justify-content: center; }
}
</style>
</head>
<body>

<div class="header">
  <h1>Red Pro v3 — Emoji Design</h1>
  <p>480 x 320 IPS — Left: quick info + emoji · Right: rich detail</p>
</div>

<div class="categories" id="cats"></div>
<div class="layout">
  <div class="scenario-list" id="list"></div>
  <div class="preview-area">
    <div class="device-frame">
      <div class="device-usb"></div>
      <div class="device-btns"><div class="device-btn-round"></div><div class="device-btn-round"></div></div>
      <div class="device-feet"><div class="device-foot"></div><div class="device-foot"></div></div>
      <div class="screen" id="screen"></div>
    </div>
    <div class="desc-panel" id="desc"></div>
    <div class="render-gallery">
      <h3>Concept Renders</h3>
      <div class="render-grid">
        <div class="render-card">
          <img src="concept-render-meeting.png" alt="Meeting countdown concept render — desk device showing upcoming 1:1 with countdown, prep context, and today's calendar" loading="lazy">
          <div class="render-caption">Meeting Countdown — desk device concept with countdown, prep context, and calendar strip</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ═════════════════════════════════════════
   SCENARIO DATA
   ═════════════════════════════════════════

   ┌──────────────────────────────────────────────────────┐
   │  NOTIFICATION LIFECYCLE DESIGN REQUIREMENTS          │
   │  (Added after device reboot incident 2026-05-02)     │
   ├──────────────────────────────────────────────────────┤
   │                                                      │
   │  1. AUTO-EXPIRY (TTL)                                │
   │     Every pushed notification MUST include a TTL.    │
   │     • working:     10 min (refreshed by heartbeat)   │
   │     • stuck:       15 min                            │
   │     • needs-input: 30 min                            │
   │     • done/error:   6 sec (auto-dismiss)             │
   │     • toast notifs: 8 sec                            │
   │     On expiry → device returns to idle.              │
   │                                                      │
   │  2. HEARTBEAT KEEP-ALIVE (working state only)        │
   │     Sender must push a heartbeat every 60s while     │
   │     task is active. Each heartbeat resets the 10min   │
   │     TTL. If heartbeat stops → TTL expires → idle.    │
   │                                                      │
   │  3. EXPLICIT CLEAR ENDPOINT                          │
   │     API must support:                                │
   │     • POST /clear — cancel any active notification   │
   │     • POST /push with type:"idle" — force idle       │
   │     Software should always send clear/done when a    │
   │     task finishes, even if TTL would handle it.      │
   │                                                      │
   │  4. DEVICE-SIDE WATCHDOG (firmware)                  │
   │     Independent of software TTL, the device runs a   │
   │     watchdog timer:                                  │
   │     • If no API activity for 15 min → return to idle │
   │     • This is the last-resort safety net             │
   │     • Prevents zombie screens even if software and   │
   │       network both fail                              │
   │                                                      │
   │  5. STATE CLEARING HIERARCHY                         │
   │     done/error clears working/stuck/needs-input.     │
   │     idle clears everything.                          │
   │     New working clears previous working.             │
   │     Notification toasts stack, not replace.           │
   │                                                      │
   └──────────────────────────────────────────────────────┘
*/
const S = [
  // ─── AMBIENT ───
  { id:'idle', name:'Idle', icon:'🕐', cat:'Ambient',
    desc:'Large clock with date and weather. The orb floats in the lower-right as a calm presence.',
    trigger:'Default state — no active notifications or tasks',
    orb:'Calm breathing (green/teal), slow 4s pulse',
    duration:'Indefinite', isNew:false },
  { id:'dashboard', name:'Dashboard', icon:'📊', cat:'Ambient',
    desc:'Two-column dashboard. Left: clock + weather + orb. Right: today\'s calendar + inbox counts + agent status.',
    trigger:'Button press from idle, or scheduled rotation',
    orb:'Small, calm green in left column',
    duration:'30s then idle', isNew:true },
  { id:'night', name:'Night Mode', icon:'🌙', cat:'Ambient',
    desc:'Near-black screen, faint clock, sleeping orb. Backlight at 10%. Notifications queue silently.',
    trigger:'Auto 22:00–07:00 or manual',
    orb:'Deep navy, barely visible, 6s ultra-slow pulse',
    duration:'Until morning', isNew:false },
  { id:'orb-idle', name:'Ambient Orb', icon:'🔮', cat:'Ambient',
    desc:'Full-screen orb as the sole element. The breathing presence. Color reflects system health.',
    trigger:'Long idle, or button toggle',
    orb:'Large centered orb, color = status',
    duration:'Indefinite', isNew:true },

  // ─── NOTIFICATIONS ───
  { id:'notif-msg', name:'Message Notification', icon:'✉️', cat:'Notifications',
    desc:'Left: header + sender + orb. Right: message body + context. Consistent two-column layout.',
    trigger:'Red handling a chat/email on your behalf',
    orb:'Default warm amber, inline left column',
    duration:'Until next state change', isNew:true },
  { id:'email', name:'Email Alert', icon:'📧', cat:'Notifications',
    desc:'Left: EMAIL header + sender name + orb. Right: subject, preview, timestamp, priority.',
    trigger:'New email from VIP or flagged sender',
    orb:'Subtle pulse on arrival',
    duration:'8s auto-dismiss', isNew:false },
  { id:'teams', name:'Teams Message', icon:'💬', cat:'Notifications',
    desc:'Left: TEAMS header + sender name + orb. Right: chat name, message preview, quick context.',
    trigger:'Mention or message in monitored chat',
    orb:'Purple-tinted pulse',
    duration:'8s', isNew:false },
  { id:'urgent', name:'Urgent Alert', icon:'🚨', cat:'Notifications',
    desc:'Left: URGENT header + severity + urgent orb. Right: alert details + impact + time. Red glow edges.',
    trigger:'Urgent keyword, VIP escalation, system alert',
    orb:'Red, fast 1.2s breathing, intense glow',
    duration:'15s or button dismiss', isNew:false },
  { id:'worth-reply', name:'Worth a Reply', icon:'💡', cat:'Notifications',

function sbar(extra) {
  return `<div class="sbar">
    <div class="sbar-left">14:26 <span style="margin:0 4px;color:#555">•</span> Sat, May 2</div>
    <div class="sbar-center">
      <span style="font-size:14px">⛅</span> <span>22°C</span> <span style="color:#555">Partly cloudy</span>
    </div>
    <div class="sbar-right">
      ${extra||''}
      <div class="sbar-batt">
        <span class="sbar-batt-icon"><span class="sbar-batt-fill" style="width:80%;background:#4ade80"></span></span>
        82%
      </div>
    </div>
  </div>`;
}

function orb(emoji, anim) {
  const a = anim || '';
  return `<div class="emoji-indicator"><span class="emoji-icon ${a}">${emoji}</span></div>`;
}

function todayStrip(items) {
  return `<div class="today-strip">
    <div class="today-hdr">TODAY</div>
    ${items.map(i=>`<div class="today-item">
      <span class="today-dot" ${i.color?`style="background:${i.color}"`:''}></span>
      <span class="today-time">${i.time}</span>
      <span class="today-title">${i.title}</span>
      <span class="today-until">${i.until}</span>
    </div>`).join('')}
  </div>`;
}

/* ═════════════════════════════════════════
   UI LOGIC
   ═════════════════════════════════════════ */
function renderCats() {
  document.getElementById('cats').innerHTML =
    `<button class="cat-btn ${activeCat==='all'?'active':''}" onclick="setCat('all')">All (${S.length})</button>` +
    CATS.map(c=>`<button class="cat-btn ${activeCat===c?'active':''}" onclick="setCat('${c}')">${c} (${S.filter(s=>s.cat===c).length})</button>`).join('');
}

function renderList() {
  const f = activeCat==='all' ? S : S.filter(s=>s.cat===activeCat);
  document.getElementById('list').innerHTML = f.map(s=>
    `<div class="scenario-item ${activeS.id===s.id?'active':''}" onclick="sel('${s.id}')">
      <span class="icon">${s.icon}</span><span class="label">${s.name}</span>
      ${s.isNew?'<span class="badge">NEW</span>':''}
    </div>`).join('');
}

function renderDesc() {
  const s = activeS;
  const cc = {Ambient:'background:rgba(74,222,128,0.12);color:#4ade80',Notifications:'background:rgba(96,165,250,0.12);color:#60a5fa',
    Calendar:'background:rgba(251,191,36,0.12);color:#fbbf24',Agent:'background:rgba(168,85,247,0.12);color:#a855f7',
    Wellness:'background:rgba(52,211,153,0.12);color:#34d399',Pro:'background:rgba(253,142,161,0.12);color:#fd8ea1'};
  document.getElementById('desc').innerHTML = `
    <h2>${s.icon} ${s.name}</h2>
    <span class="cat-tag" style="${cc[s.cat]||''}">${s.cat}${s.isNew?' — New for Pro':''}</span>
    <p>${s.desc}</p>
    <div class="dets">
      <div class="det-row"><span class="det-lbl">Trigger</span><span class="det-val">${s.trigger}</span></div>
      <div class="det-row"><span class="det-lbl">Emoji</span><span class="det-val">${s.orb}</span></div>
      <div class="det-row"><span class="det-lbl">Duration</span><span class="det-val">${s.duration}</span></div>
    </div>`;
}

function sel(id) { activeS = S.find(s=>s.id===id); document.getElementById('screen').innerHTML = (R[id]||R.idle)(); renderList(); renderDesc(); }
function setCat(c) { activeCat = c; renderCats(); renderList(); }

renderCats(); renderList(); sel('countdown');
</script>
